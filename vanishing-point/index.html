<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BYO — Vanishing Point (keystone)</title>
  <style>
    html, body {
      height: 100%; margin: 0; background: #ffffff; overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      color: #000;
    }
    .wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: 4vw; box-sizing: border-box;
    }
    .line {
      font-weight: 800; text-transform: uppercase; line-height: 1.0;
      letter-spacing: -0.02em; white-space: nowrap;
    }
    /* black anchors: plain DOM text — stay in place and are selectable */
    .static { color: #000; }
    /* changing colour words get the keystone (vanishing-point) warp */
    .warp {
      display: inline-block;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .hint {
      position: fixed; left: 14px; bottom: 12px; font-size: 12px;
      letter-spacing: .02em; color: #9aa0a6; user-select: none; pointer-events: none;
    }
    .vp { position: fixed; width: 10px; height: 10px; border-radius: 50%;
          background: #ff3b30; transform: translate(-50%, -50%);
          pointer-events: none; opacity: 0; transition: opacity .3s, left .3s, top .3s; }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="line"><span class="static">BYO </span><span class="warp" id="w-noun"></span></div>
    <div class="line"><span class="static">HOW CAN </span><span class="warp" id="w-plural"></span></div>
    <div class="line"><span class="warp" id="w-verb"></span><span class="static"> SCIENCE</span></div>
  </div>
  <div class="vp" id="vpDot"></div>
  <div class="hint">move horizontally over the top half to change the noun · bottom half for the verb · the vanishing point jumps each change</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <script src="word-pairings.js"></script>
  <script>
  (function () {

    /* ================================================================
       CONFIG — also editable live in the GUI (top-right)
       ================================================================ */
    const CONFIG = {
      // --- keystone warp (the flat CSS perspective) ---
      perspective:   420,   // px — smaller = stronger keystone distortion
      warpStrength:  34,    // max tilt (deg) of a changing word toward the VP
      angleScale:    520,   // px from a word to the VP that reaches full strength
      warpTransitionMs: 500,// glide time when the warp re-aims at a new VP

      // --- vanishing point (randomised within these ranges on every word change) ---
      vpXmin: 10, vpXmax: 90,   // % of viewport
      vpYmin: 10, vpYmax: 90,
      showVpDot: true,

      // --- text ---
      fontPx: 96,
      letterSpacing: -2,    // px
      lineGap: 6            // px between the three lines
    };
    /* ================================================================ */

    const data = window.WORD_DATA;
    const nouns = data.nouns;

    const sdgColors = [
      '#E5233D', '#DDA73A', '#4CA146', '#C5192D', '#EF402C', '#27BFE6',
      '#FBC412', '#A31C44', '#F26A2D', '#E01483', '#F89D2A', '#BF8D2C',
      '#407F46', '#1F97D4', '#59BA48', '#126A9F', '#13496B'
    ];
    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const randColor = () => sdgColors[Math.floor(Math.random() * sdgColors.length)];
    const contrast = ex => { const a = sdgColors.filter(c => c !== ex); return a[Math.floor(Math.random() * a.length)]; };

    // ---------- state ----------
    let nounIndex = 0, verbIndex = 0;
    let nounColor = randColor(), verbColor = contrast(nounColor);

    const wrap   = document.getElementById('wrap');
    const wNoun  = document.getElementById('w-noun');
    const wPlural= document.getElementById('w-plural');
    const wVerb  = document.getElementById('w-verb');
    const warpEls = [wNoun, wPlural, wVerb];
    const vpDot  = document.getElementById('vpDot');

    function applyText() {
      wrap.querySelectorAll('.line').forEach(l => {
        l.style.fontSize = CONFIG.fontPx + 'px';
        l.style.letterSpacing = CONFIG.letterSpacing + 'px';
        l.style.marginBottom = CONFIG.lineGap + 'px';
      });
      warpEls.forEach(el => el.style.transition = `transform ${CONFIG.warpTransitionMs}ms ease`);
    }

    function relayout() {
      const n = nouns[nounIndex];
      const verb = n.verbs[verbIndex % n.verbs.length].toUpperCase();
      wNoun.textContent = n.word;          wNoun.style.color = nounColor;
      wPlural.textContent = n.plural;      wPlural.style.color = nounColor;
      wVerb.textContent = verb + ' ';      wVerb.style.color = verbColor;
      applyWarp();   // word width changed → re-aim
    }

    // ---------- the keystone warp: aim each changing word at the vanishing point ----------
    let vpX = 50, vpY = 45;
    function setVP(x, y) {
      vpX = x; vpY = y;
      vpDot.style.left = (x / 100 * window.innerWidth) + 'px';
      vpDot.style.top  = (y / 100 * window.innerHeight) + 'px';
      vpDot.style.opacity = CONFIG.showVpDot ? 0.9 : 0;
    }
    function randomizeVP() {
      setVP(rand(CONFIG.vpXmin, CONFIG.vpXmax), rand(CONFIG.vpYmin, CONFIG.vpYmax));
      applyWarp();
    }
    function applyWarp() {
      const vx = vpX / 100 * window.innerWidth;
      const vy = vpY / 100 * window.innerHeight;
      warpEls.forEach(el => {
        const prev = el.style.transform; el.style.transform = 'none';   // measure untransformed
        const r = el.getBoundingClientRect();
        el.style.transform = prev;
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const ay =  clamp((vx - cx) / CONFIG.angleScale, -1, 1) * CONFIG.warpStrength; // rotateY → horizontal VP
        const ax = -clamp((vy - cy) / CONFIG.angleScale, -1, 1) * CONFIG.warpStrength; // rotateX → vertical VP
        el.style.transform = `perspective(${CONFIG.perspective}px) rotateY(${ay}deg) rotateX(${ax}deg)`;
      });
    }

    // ---------- cycles (each change randomises the vanishing point) ----------
    function cycleNoun() {
      nounIndex = (nounIndex + 1) % nouns.length;
      nounColor = randColor(); verbIndex = 0; verbColor = contrast(nounColor);
      relayout(); randomizeVP();
    }
    function cycleVerb() {
      verbIndex = (verbIndex + 1) % nouns[nounIndex].verbs.length;
      verbColor = contrast(nounColor);
      relayout(); randomizeVP();
    }

    // ---------- interaction ----------
    let lastX = [0, 0], lastY = 0;
    const gestureThreshold = 45;
    function handleMove(cx, cy) {
      const zone = cy < window.innerHeight / 2 ? 0 : 1;   // top = noun, bottom = verb
      const dx = cx - lastX[zone], dy = cy - lastY;
      if (Math.abs(dx) > gestureThreshold && Math.abs(dx) > Math.abs(dy)) {
        zone === 0 ? cycleNoun() : cycleVerb();
        lastX[zone] = cx;
      }
      lastY = cy;
    }
    // pointer (not text selection) drives changes; selecting text still works on click-drag over black words
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { const t = e.touches[0]; handleMove(t.clientX, t.clientY); }, { passive: true });

    // ---------- init ----------
    applyText();
    relayout();
    setVP(vpX, vpY);
    applyWarp();
    window.addEventListener('resize', () => { setVP(vpX, vpY); applyWarp(); });

    // ---------- GUI ----------
    const gui = new dat.GUI({ width: 320 });

    const fK = gui.addFolder('Keystone warp');
    fK.add(CONFIG, 'perspective', 120, 1500, 10).name('perspective').onChange(applyWarp);
    fK.add(CONFIG, 'warpStrength', 0, 80, 1).name('strength (°)').onChange(applyWarp);
    fK.add(CONFIG, 'angleScale', 100, 1500, 10).name('falloff (px)').onChange(applyWarp);
    fK.add(CONFIG, 'warpTransitionMs', 0, 1500, 10).name('glide (ms)').onChange(applyText);
    fK.open();

    const fVP = gui.addFolder('Vanishing point');
    fVP.add(CONFIG, 'vpXmin', 0, 100, 1).name('VP x min');
    fVP.add(CONFIG, 'vpXmax', 0, 100, 1).name('VP x max');
    fVP.add(CONFIG, 'vpYmin', 0, 100, 1).name('VP y min');
    fVP.add(CONFIG, 'vpYmax', 0, 100, 1).name('VP y max');
    fVP.add(CONFIG, 'showVpDot').name('show VP marker').onChange(() => setVP(vpX, vpY));
    fVP.add({ jump: randomizeVP }, 'jump').name('▶ randomize now');
    fVP.open();

    const fT = gui.addFolder('Text');
    fT.add(CONFIG, 'fontPx', 20, 220, 1).name('font size').onChange(() => { applyText(); applyWarp(); });
    fT.add(CONFIG, 'letterSpacing', -10, 20, 0.5).name('letter spacing').onChange(() => { applyText(); applyWarp(); });
    fT.add(CONFIG, 'lineGap', -20, 60, 1).name('line gap').onChange(() => { applyText(); applyWarp(); });
    fT.open();
  })();
  </script>
</body>
</html>
