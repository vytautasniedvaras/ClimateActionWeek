<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BYO — Cube</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      cursor: pointer;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hint {
      position: fixed; left: 14px; bottom: 12px;
      font-size: 12px; letter-spacing: 0.02em; color: #9aa0a6;
      user-select: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hint">move horizontally over a line to change its words · move between lines to turn the cube</div>

  <!-- three.js (UMD build, exposes global THREE — works over file://) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="word-pairings.js"></script>
  <script>
  (function () {

    /* ================================================================
       CONFIG — tweak everything here
       ================================================================ */
    const CONFIG = {
      // --- cube geometry (world units) ---
      cubeWidth:  4.4,     // also the cube depth (square column)
      cubeHeight: 3.9,     // total height (split into 3 slices)

      // --- text ---
      fontScale:       0.82,   // font size as a fraction of a slice's height (bigger = larger text)
      letterSpacingEm: -0.05,  // negative = tighter letters
      faceResolution:  1024,   // per-face canvas width in px (texture sharpness)
      textPadding:     0.96,   // fraction of a face used before wrap kicks in (1 = full face)

      // --- camera ---
      camDistLandscape: 8.0,   // camera distance on wide screens
      camDistPortrait:  11.5,  // camera distance on tall screens

      // --- motion / speeds ---
      easeFactor:    0.12,                 // how quickly the active line settles facing you (0–1)
      groupIdleSpin: 0.0030,               // whole-cube slow turn (0 = still)
      slabSpin:      [0.014, -0.018, 0.022], // per-slab turn speed when NOT the active line
      gestureThreshold: 45,                // px of horizontal travel needed to change a word

      // --- look ---
      glassOpacity:   0.05,
      edgeOpacity:    0.6,
      dividerOpacity: 0.5,
      glassColor:  0x6fa8d8,
      edgeColor:   0xbfc6cc,
      dividerColor:0xd5dade
    };

    /* ================================================================ */

    const data = window.WORD_DATA;
    const nouns = data.nouns;

    // ---------- SDG colour palette ----------
    const sdgColors = [
      '#E5233D', '#DDA73A', '#4CA146', '#C5192D', '#EF402C', '#27BFE6',
      '#FBC412', '#A31C44', '#F26A2D', '#E01483', '#F89D2A', '#BF8D2C',
      '#407F46', '#1F97D4', '#59BA48', '#126A9F', '#13496B'
    ];
    const randColor = () => sdgColors[Math.floor(Math.random() * sdgColors.length)];
    const contrast = ex => { const a = sdgColors.filter(c => c !== ex); return a[Math.floor(Math.random() * a.length)]; };

    // ---------- state ----------
    let nounIndex = 0, verbIndex = 0;
    let nounColor = randColor(), verbColor = contrast(nounColor);

    // ---------- derived dimensions ----------
    const L      = CONFIG.cubeWidth;            // cube width & depth
    const CUBE_H = CONFIG.cubeHeight;
    const SLICE  = CUBE_H / 3;                   // height of one slice
    const positions = [SLICE, 0, -SLICE];

    const WF = CONFIG.faceResolution;            // per-face canvas width
    const HF = Math.round(WF * SLICE / L);       // per-face canvas height (matches face aspect)
    const WM = WF * 4;                           // perimeter master width
    const FONT_PX = Math.round(HF * CONFIG.fontScale);
    const LETTER_SP = `${(FONT_PX * CONFIG.letterSpacingEm).toFixed(2)}px`;
    const fontStr = `800 ${FONT_PX}px Inter, Arial, sans-serif`;

    // ---------- text canvases (one perimeter master + 4 face crops per line) ----------
    function makeLine() {
      const master = document.createElement('canvas');
      master.width = WM; master.height = HF;
      const mctx = master.getContext('2d');
      const faces = [];
      for (let k = 0; k < 4; k++) {
        const c = document.createElement('canvas');
        c.width = WF; c.height = HF;
        const tex = new THREE.CanvasTexture(c);
        tex.anisotropy = 8; tex.minFilter = THREE.LinearFilter;
        faces.push({ canvas: c, ctx: c.getContext('2d'), tex });
      }
      return { master, mctx, faces };
    }
    const lineTex = [makeLine(), makeLine(), makeLine()];

    // contiguous source windows around the column (wraps at WM): left, front, right, back
    const SRC_START = { front: 1.5 * WF, right: 2.5 * WF, back: 3.5 * WF, left: 0.5 * WF };

    function drawLine(idx, segs) {
      const L0 = lineTex[idx];
      const { mctx } = L0;
      mctx.clearRect(0, 0, WM, HF);
      mctx.font = fontStr;
      if ('letterSpacing' in mctx) mctx.letterSpacing = LETTER_SP;
      mctx.textBaseline = 'middle';
      mctx.textAlign = 'left';
      const total = segs.reduce((w, s) => w + mctx.measureText(s.text).width, 0);
      let x = (WM - total) / 2;                       // centre on the perimeter
      for (const seg of segs) {
        mctx.fillStyle = seg.color;
        mctx.fillText(seg.text, x, HF / 2 + 3);
        x += mctx.measureText(seg.text).width;
      }
      const order = ['front', 'right', 'back', 'left'];
      order.forEach((name, k) => {
        const f = L0.faces[k];
        f.ctx.clearRect(0, 0, WF, HF);
        const start = SRC_START[name];
        const first = Math.min(WF, WM - start);
        f.ctx.drawImage(L0.master, start, 0, first, HF, 0, 0, first, HF);
        if (first < WF) f.ctx.drawImage(L0.master, 0, 0, WF - first, HF, first, 0, WF - first, HF);
        f.tex.needsUpdate = true;
      });
    }

    function relayout() {
      const n = nouns[nounIndex];
      const verb = n.verbs[verbIndex % n.verbs.length].toUpperCase();
      drawLine(0, [{ text: 'BYO ', color: '#000' }, { text: n.word, color: nounColor }]);
      drawLine(1, [{ text: 'HOW CAN ', color: '#000' }, { text: n.plural, color: nounColor }]);
      drawLine(2, [{ text: verb + ' ', color: verbColor }, { text: 'SCIENCE', color: '#000' }]);
    }
    function cycleNoun() {
      nounIndex = (nounIndex + 1) % nouns.length;
      nounColor = randColor(); verbIndex = 0; verbColor = contrast(nounColor);
      relayout();
    }
    function cycleVerb() {
      verbIndex = (verbIndex + 1) % nouns[nounIndex].verbs.length;
      verbColor = contrast(nounColor);
      relayout();
    }

    // ---------- three.js scene ----------
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 8);
    camera.lookAt(0, 0, 0);

    const group = new THREE.Group();
    scene.add(group);

    // transparent glass cube + edges + slice dividers
    const boxGeo = new THREE.BoxGeometry(L, CUBE_H, L);
    group.add(new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({
      color: CONFIG.glassColor, transparent: true, opacity: CONFIG.glassOpacity, side: THREE.DoubleSide, depthWrite: false
    })));
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo),
      new THREE.LineBasicMaterial({ color: CONFIG.edgeColor, transparent: true, opacity: CONFIG.edgeOpacity })));
    function divider(y) {
      const hw = L / 2;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        -hw, y, -hw,  hw, y, -hw,  hw, y, hw,  -hw, y, hw,  -hw, y, -hw
      ]), 3));
      return new THREE.Line(g, new THREE.LineBasicMaterial({ color: CONFIG.dividerColor, transparent: true, opacity: CONFIG.dividerOpacity }));
    }
    group.add(divider(CUBE_H / 6));
    group.add(divider(-CUBE_H / 6));

    // each slice = 4 vertical faces around the Y axis; double-sided so text shows from both sides
    const HALF = Math.PI / 2;
    const faceDefs = [
      { pos: [0, 0,  L / 2], rotY: 0 },        // front
      { pos: [ L / 2, 0, 0], rotY:  HALF },    // right
      { pos: [0, 0, -L / 2], rotY: Math.PI },  // back
      { pos: [-L / 2, 0, 0], rotY: -HALF }     // left
    ];
    const planeGeo = new THREE.PlaneGeometry(L, SLICE);
    const slices = [];
    for (let i = 0; i < 3; i++) {
      const sliceGroup = new THREE.Group();
      sliceGroup.position.y = positions[i];
      faceDefs.forEach((f, k) => {
        const mat = new THREE.MeshBasicMaterial({ map: lineTex[i].faces[k].tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
        const mesh = new THREE.Mesh(planeGeo, mat);
        mesh.position.set(f.pos[0], f.pos[1], f.pos[2]);
        mesh.rotation.y = f.rotY;
        sliceGroup.add(mesh);
      });
      group.add(sliceGroup);
      slices.push(sliceGroup);
    }

    relayout();

    // ---------- interaction ----------
    let activeLine = 0;
    let lastX = [0, 0, 0], lastY = 0;
    const lineFromY = y => { const t = y / window.innerHeight; return t < 1 / 3 ? 0 : (t < 2 / 3 ? 1 : 2); };

    function handleMove(cx, cy) {
      activeLine = lineFromY(cy);
      const dx = cx - lastX[activeLine], dy = cy - lastY;
      if (Math.abs(dx) > CONFIG.gestureThreshold && Math.abs(dx) > Math.abs(dy)) {
        if (activeLine === 2) cycleVerb(); else cycleNoun();
        lastX[activeLine] = cx;
      }
      lastY = cy;
    }
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; handleMove(t.clientX, t.clientY); }, { passive: false });

    // ---------- render loop ----------
    const TWO_PI = Math.PI * 2;
    function animate() {
      requestAnimationFrame(animate);
      group.rotation.y += CONFIG.groupIdleSpin;             // whole cube keeps moving
      for (let i = 0; i < 3; i++) {
        const s = slices[i];
        if (i === activeLine) {
          // face the camera in world space (cancel the group's idle spin), via the nearest turn
          const desired = -group.rotation.y;
          const target = desired + Math.round((s.rotation.y - desired) / TWO_PI) * TWO_PI;
          s.rotation.y += (target - s.rotation.y) * CONFIG.easeFactor;
        } else {
          s.rotation.y += CONFIG.slabSpin[i];               // other slabs turn → text wraps around
        }
      }
      renderer.render(scene, camera);
    }

    // ---------- resize ----------
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.position.z = w / h < 1 ? CONFIG.camDistPortrait : CONFIG.camDistLandscape;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    animate();
  })();
  </script>
</body>
</html>
