<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BYO — Cube</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      cursor: pointer;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hint {
      position: fixed; left: 14px; bottom: 12px;
      font-size: 12px; letter-spacing: 0.02em; color: #9aa0a6;
      user-select: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hint">move horizontally over a line to change its words · move between lines to turn the cube</div>

  <!-- three.js (UMD build, exposes global THREE — works over file://) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="word-pairings.js"></script>
  <script>
  (function () {
    const data = window.WORD_DATA;
    const nouns = data.nouns;

    // ---------- SDG colour palette ----------
    const sdgColors = [
      '#E5233D', '#DDA73A', '#4CA146', '#C5192D', '#EF402C', '#27BFE6',
      '#FBC412', '#A31C44', '#F26A2D', '#E01483', '#F89D2A', '#BF8D2C',
      '#407F46', '#1F97D4', '#59BA48', '#126A9F', '#13496B'
    ];
    const randColor = () => sdgColors[Math.floor(Math.random() * sdgColors.length)];
    const contrast = ex => { const a = sdgColors.filter(c => c !== ex); return a[Math.floor(Math.random() * a.length)]; };

    // ---------- state ----------
    let nounIndex = 0, verbIndex = 0;
    let nounColor = randColor(), verbColor = contrast(nounColor);

    // ---------- cube dimensions (square column → 4 vertical faces) ----------
    const L      = 4.0;                 // cube width & depth
    const CUBE_H = 3.8;                 // cube height
    const SLICE  = CUBE_H / 3;          // height of one horizontal slice
    const positions = [SLICE, 0, -SLICE];

    // ---------- text canvases ----------
    // Each line is drawn at a FIXED size onto a full "perimeter" canvas (4 faces wide).
    // Short text sits on the front face; long text spills onto the side/back faces (wraps around).
    const WF = 1024;                                  // per-face canvas width (px)
    const HF = Math.round(WF * SLICE / L);            // per-face canvas height (keeps face aspect)
    const WM = WF * 4;                                // perimeter master width
    const FONT_PX = Math.round(HF * 0.58);            // one fixed font size for every line
    const fontStr = `800 ${FONT_PX}px Inter, Arial, sans-serif`;

    // master (offscreen) + 4 face canvases per line
    function makeLine() {
      const master = document.createElement('canvas');
      master.width = WM; master.height = HF;
      const mctx = master.getContext('2d');
      const faces = [];
      for (let k = 0; k < 4; k++) {
        const c = document.createElement('canvas');
        c.width = WF; c.height = HF;
        const tex = new THREE.CanvasTexture(c);
        tex.anisotropy = 8; tex.minFilter = THREE.LinearFilter;
        faces.push({ canvas: c, ctx: c.getContext('2d'), tex });
      }
      return { master, mctx, faces };
    }
    const lineTex = [makeLine(), makeLine(), makeLine()];

    // contiguous source windows around the column: left, front, right, back  (wraps at WM)
    // face order used below is [front, right, back, left]; their source starts:
    const SRC_START = { front: 1.5 * WF, right: 2.5 * WF, back: 3.5 * WF, left: 0.5 * WF };

    function drawLine(idx, segs) {
      const L0 = lineTex[idx];
      const { mctx } = L0;
      mctx.clearRect(0, 0, WM, HF);
      mctx.font = fontStr;
      mctx.textBaseline = 'middle';
      mctx.textAlign = 'left';
      const total = segs.reduce((w, s) => w + mctx.measureText(s.text).width, 0);
      let x = (WM - total) / 2;                       // centre the text on the perimeter
      for (const seg of segs) {
        mctx.fillStyle = seg.color;
        mctx.fillText(seg.text, x, HF / 2 + 3);
        x += mctx.measureText(seg.text).width;
      }
      // crop each quarter onto its face (with wrap-around at the seam)
      const order = ['front', 'right', 'back', 'left'];
      order.forEach((name, k) => {
        const f = L0.faces[k];
        f.ctx.clearRect(0, 0, WF, HF);
        let start = SRC_START[name];
        const first = Math.min(WF, WM - start);
        f.ctx.drawImage(L0.master, start, 0, first, HF, 0, 0, first, HF);
        if (first < WF) {                              // wrapped past the master's right edge
          f.ctx.drawImage(L0.master, 0, 0, WF - first, HF, first, 0, WF - first, HF);
        }
        f.tex.needsUpdate = true;
      });
    }

    function relayout() {
      const n = nouns[nounIndex];
      const verb = n.verbs[verbIndex % n.verbs.length].toUpperCase();
      drawLine(0, [{ text: 'BYO ', color: '#000' }, { text: n.word, color: nounColor }]);
      drawLine(1, [{ text: 'HOW CAN ', color: '#000' }, { text: n.plural, color: nounColor }]);
      drawLine(2, [{ text: verb + ' ', color: verbColor }, { text: 'SCIENCE', color: '#000' }]);
    }
    function cycleNoun() {
      nounIndex = (nounIndex + 1) % nouns.length;
      nounColor = randColor(); verbIndex = 0; verbColor = contrast(nounColor);
      relayout();
    }
    function cycleVerb() {
      verbIndex = (verbIndex + 1) % nouns[nounIndex].verbs.length;
      verbColor = contrast(nounColor);
      relayout();
    }

    // ---------- three.js scene ----------
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 8);
    camera.lookAt(0, 0, 0);

    const group = new THREE.Group();
    scene.add(group);

    // transparent glass cube + edges + slice dividers
    const boxGeo = new THREE.BoxGeometry(L, CUBE_H, L);
    group.add(new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({
      color: 0x6fa8d8, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false
    })));
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo),
      new THREE.LineBasicMaterial({ color: 0xbfc6cc, transparent: true, opacity: 0.6 })));
    function divider(y) {
      const hw = L / 2;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        -hw, y, -hw,  hw, y, -hw,  hw, y, hw,  -hw, y, hw,  -hw, y, -hw
      ]), 3));
      return new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xd5dade, transparent: true, opacity: 0.5 }));
    }
    group.add(divider(CUBE_H / 6));
    group.add(divider(-CUBE_H / 6));

    // each slice = 4 vertical faces around the Y axis; rolling about Y wraps text around them.
    const HALF = Math.PI / 2;
    const faceDefs = [
      { pos: [0, 0,  L / 2], rotY: 0 },        // front
      { pos: [ L / 2, 0, 0], rotY:  HALF },    // right
      { pos: [0, 0, -L / 2], rotY: Math.PI },  // back
      { pos: [-L / 2, 0, 0], rotY: -HALF }     // left
    ];
    const planeGeo = new THREE.PlaneGeometry(L, SLICE);
    const slices = [];
    const spinSpeed = [0.012, -0.016, 0.02];
    for (let i = 0; i < 3; i++) {
      const sliceGroup = new THREE.Group();
      sliceGroup.position.y = positions[i];
      faceDefs.forEach((f, k) => {
        const mat = new THREE.MeshBasicMaterial({ map: lineTex[i].faces[k].tex, transparent: true, side: THREE.FrontSide, depthWrite: false });
        const mesh = new THREE.Mesh(planeGeo, mat);
        mesh.position.set(f.pos[0], f.pos[1], f.pos[2]);
        mesh.rotation.y = f.rotY;
        sliceGroup.add(mesh);
      });
      group.add(sliceGroup);
      slices.push(sliceGroup);
    }

    relayout();

    // ---------- interaction ----------
    let activeLine = 0;
    let lastX = [0, 0, 0], lastY = 0;
    const threshold = 45;
    const lineFromY = y => { const t = y / window.innerHeight; return t < 1 / 3 ? 0 : (t < 2 / 3 ? 1 : 2); };

    function handleMove(cx, cy) {
      activeLine = lineFromY(cy);
      const dx = cx - lastX[activeLine], dy = cy - lastY;
      if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
        if (activeLine === 2) cycleVerb(); else cycleNoun();
        lastX[activeLine] = cx;
      }
      lastY = cy;
    }
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; handleMove(t.clientX, t.clientY); }, { passive: false });

    // ---------- render loop ----------
    const TWO_PI = Math.PI * 2;
    function animate() {
      requestAnimationFrame(animate);
      for (let i = 0; i < 3; i++) {
        const s = slices[i];
        if (i === activeLine) {
          const target = Math.round(s.rotation.y / TWO_PI) * TWO_PI;  // ease to front face, centred
          s.rotation.y += (target - s.rotation.y) * 0.12;
        } else {
          s.rotation.y += spinSpeed[i];   // turn about Y → text wraps around the faces
        }
      }
      renderer.render(scene, camera);
    }

    // ---------- resize ----------
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.position.z = w / h < 1 ? 11 : 8;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    animate();
  })();
  </script>
</body>
</html>
