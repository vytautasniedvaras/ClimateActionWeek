<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BYO — Cube</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      cursor: pointer;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hint {
      position: fixed;
      left: 14px;
      bottom: 12px;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: #9aa0a6;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hint">move horizontally over a line to change its words · move between lines to spin the cube</div>

  <!-- three.js (UMD build, exposes global THREE — works over file://) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="word-pairings.js"></script>
  <script>
  (function () {
    const data = window.WORD_DATA;
    const nouns = data.nouns;

    // ---------- SDG colour palette ----------
    const sdgColors = [
      '#E5233D', '#DDA73A', '#4CA146', '#C5192D', '#EF402C', '#27BFE6',
      '#FBC412', '#A31C44', '#F26A2D', '#E01483', '#F89D2A', '#BF8D2C',
      '#407F46', '#1F97D4', '#59BA48', '#126A9F', '#13496B'
    ];
    function randColor() { return sdgColors[Math.floor(Math.random() * sdgColors.length)]; }
    function contrast(exclude) {
      const a = sdgColors.filter(c => c !== exclude);
      return a[Math.floor(Math.random() * a.length)];
    }

    // ---------- state ----------
    let nounIndex = 0;
    let verbIndex = 0;
    let nounColor = randColor();
    let verbColor = contrast(nounColor);

    // ---------- text-on-canvas textures ----------
    const CW = 2048, CH = 512;            // 4:1 canvas → matches 4×1 plane
    function makeTextLayer() {
      const canvas = document.createElement('canvas');
      canvas.width = CW; canvas.height = CH;
      const ctx = canvas.getContext('2d');
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      tex.minFilter = THREE.LinearFilter;
      return { canvas, ctx, tex };
    }

    // segments = [{text, color}]  → drawn centred, scaled to fit width
    function drawLine(layer, segments) {
      const { ctx, tex } = layer;
      ctx.clearRect(0, 0, CW, CH);
      const maxW = CW * 0.94;
      let size = 300;
      const font = s => `800 ${s}px Inter, Arial, sans-serif`;

      ctx.font = font(size);
      let total = segments.reduce((w, s) => w + ctx.measureText(s.text).width, 0);
      if (total > maxW) { size *= maxW / total; ctx.font = font(size); }

      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      total = segments.reduce((w, s) => w + ctx.measureText(s.text).width, 0);
      let x = (CW - total) / 2;
      for (const seg of segments) {
        ctx.fillStyle = seg.color;
        ctx.fillText(seg.text, x, CH / 2 + 6);
        x += ctx.measureText(seg.text).width;
      }
      tex.needsUpdate = true;
    }

    // ---------- three.js scene ----------
    const canvasEl = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 7);
    camera.lookAt(0, 0, 0);

    const group = new THREE.Group();
    scene.add(group);

    // --- transparent glass cube (edges + faint faces + slice dividers) ---
    const CUBE_W = 5.2, CUBE_H = 3.8, CUBE_D = 1.6;
    const boxGeo = new THREE.BoxGeometry(CUBE_W, CUBE_H, CUBE_D);
    const glass = new THREE.Mesh(
      boxGeo,
      new THREE.MeshBasicMaterial({ color: 0x6fa8d8, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false })
    );
    group.add(glass);
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(boxGeo),
      new THREE.LineBasicMaterial({ color: 0xbfc6cc, transparent: true, opacity: 0.6 })
    );
    group.add(edges);

    // two horizontal dividers → three equal slices
    function divider(y) {
      const g = new THREE.BufferGeometry();
      const hw = CUBE_W / 2, hd = CUBE_D / 2;
      const v = new Float32Array([
        -hw, y, -hd,  hw, y, -hd,  hw, y, hd,  -hw, y, hd,  -hw, y, -hd
      ]);
      g.setAttribute('position', new THREE.BufferAttribute(v, 3));
      return new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xd5dade, transparent: true, opacity: 0.5 }));
    }
    group.add(divider(CUBE_H / 6));
    group.add(divider(-CUBE_H / 6));

    // --- three text slices ---
    const SLICE_Y = CUBE_H / 3;                  // centre of each slice
    const planeGeo = new THREE.PlaneGeometry(4.6, 1.15);
    const layers = [makeTextLayer(), makeTextLayer(), makeTextLayer()];
    const planes = [];
    const positions = [SLICE_Y, 0, -SLICE_Y];     // line0 top, line1 mid, line2 bottom
    const spinSpeed = [0.013, -0.017, 0.02];
    for (let i = 0; i < 3; i++) {
      const mat = new THREE.MeshBasicMaterial({
        map: layers[i].tex, transparent: true, side: THREE.DoubleSide, depthWrite: false
      });
      const mesh = new THREE.Mesh(planeGeo, mat);
      mesh.position.set(0, positions[i], CUBE_D / 2 + 0.01);  // front face of its slice
      group.add(mesh);
      planes.push(mesh);
    }

    // ---------- content ----------
    function redrawNoun() {
      const n = nouns[nounIndex];
      drawLine(layers[0], [{ text: 'BYO', color: '#000' }, { text: n.word, color: nounColor }]);
      drawLine(layers[1], [{ text: 'HOW CAN ', color: '#000' }, { text: n.plural, color: nounColor }]);
    }
    function redrawVerb() {
      const n = nouns[nounIndex];
      const verb = n.verbs[verbIndex % n.verbs.length];
      drawLine(layers[2], [{ text: verb.toUpperCase() + ' ', color: verbColor }, { text: 'SCIENCE', color: '#000' }]);
    }
    function cycleNoun() {
      nounIndex = (nounIndex + 1) % nouns.length;
      nounColor = randColor();
      verbIndex = 0;
      verbColor = contrast(nounColor);
      redrawNoun();
      redrawVerb();
    }
    function cycleVerb() {
      const list = nouns[nounIndex].verbs;
      verbIndex = (verbIndex + 1) % list.length;
      verbColor = contrast(nounColor);
      redrawVerb();
    }
    redrawNoun();
    redrawVerb();

    // ---------- interaction ----------
    let activeLine = 0;            // which slice is flat / being manipulated
    let lastX = [0, 0, 0];
    let lastY = 0;
    const threshold = 45;

    function lineFromY(clientY) {
      const t = clientY / window.innerHeight;
      return t < 1 / 3 ? 0 : (t < 2 / 3 ? 1 : 2);
    }

    function handleMove(clientX, clientY) {
      activeLine = lineFromY(clientY);
      const dx = clientX - lastX[activeLine];
      const dy = clientY - lastY;
      if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
        if (activeLine === 2) cycleVerb();   // bottom slice → verb
        else cycleNoun();                    // top / middle slice → noun (+ plural mirror)
        lastX[activeLine] = clientX;
      }
      lastY = clientY;
    }

    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      handleMove(t.clientX, t.clientY);
    }, { passive: false });

    // ---------- render loop ----------
    const TWO_PI = Math.PI * 2;
    function animate() {
      requestAnimationFrame(animate);
      for (let i = 0; i < 3; i++) {
        const p = planes[i];
        if (i === activeLine) {
          // ease to the nearest flat orientation (multiple of 2π) → faces camera
          const target = Math.round(p.rotation.x / TWO_PI) * TWO_PI;
          p.rotation.x += (target - p.rotation.x) * 0.12;
        } else {
          p.rotation.x += spinSpeed[i];      // the other lines keep rotating
        }
      }
      renderer.render(scene, camera);
    }

    // ---------- resize ----------
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // pull the camera back a touch on portrait screens so the cube always fits
      camera.position.z = w / h < 1 ? 9.5 : 7;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    animate();
  })();
  </script>
</body>
</html>
