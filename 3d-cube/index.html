<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BYO — Cube</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      cursor: pointer;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hint {
      position: fixed; left: 14px; bottom: 12px;
      font-size: 12px; letter-spacing: 0.02em; color: #9aa0a6;
      user-select: none; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="hint">move horizontally over a line to change its words · move between lines to roll the cube</div>

  <!-- three.js (UMD build, exposes global THREE — works over file://) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="word-pairings.js"></script>
  <script>
  (function () {
    const data = window.WORD_DATA;
    const nouns = data.nouns;

    // ---------- SDG colour palette ----------
    const sdgColors = [
      '#E5233D', '#DDA73A', '#4CA146', '#C5192D', '#EF402C', '#27BFE6',
      '#FBC412', '#A31C44', '#F26A2D', '#E01483', '#F89D2A', '#BF8D2C',
      '#407F46', '#1F97D4', '#59BA48', '#126A9F', '#13496B'
    ];
    const randColor = () => sdgColors[Math.floor(Math.random() * sdgColors.length)];
    const contrast = ex => { const a = sdgColors.filter(c => c !== ex); return a[Math.floor(Math.random() * a.length)]; };

    // ---------- state ----------
    let nounIndex = 0, verbIndex = 0;
    let nounColor = randColor(), verbColor = contrast(nounColor);

    // ---------- cube dimensions ----------
    const CUBE_W = 5.2;
    const CUBE_H = 3.8;
    const SLICE  = CUBE_H / 3;          // height of one slice
    const CUBE_D = SLICE;               // depth = slice height → square cross-section so text wraps evenly
    const R      = SLICE / 2;           // distance of each wrapped face from the slice's roll axis
    const positions = [SLICE, 0, -SLICE];

    // ---------- text-on-canvas (one texture per line, shown on all 4 wrapped faces) ----------
    const PLANE_W = 4.6, PLANE_H = SLICE;
    const CW = 2048, CH = Math.round(CW * PLANE_H / PLANE_W);
    function makeLayer() {
      const canvas = document.createElement('canvas');
      canvas.width = CW; canvas.height = CH;
      const ctx = canvas.getContext('2d');
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      tex.minFilter = THREE.LinearFilter;
      return { canvas, ctx, tex };
    }
    const layers = [makeLayer(), makeLayer(), makeLayer()];
    const measureCtx = layers[0].ctx;
    const fontOf = s => `800 ${s}px Inter, Arial, sans-serif`;
    const widthOf = (segs, size) => {
      measureCtx.font = fontOf(size);
      return segs.reduce((w, s) => w + measureCtx.measureText(s.text).width, 0);
    };

    function drawLine(layer, segs, size) {
      const { ctx, tex } = layer;
      ctx.clearRect(0, 0, CW, CH);
      ctx.font = fontOf(size);
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      const total = segs.reduce((w, s) => w + ctx.measureText(s.text).width, 0);
      let x = (CW - total) / 2;
      for (const seg of segs) {
        ctx.fillStyle = seg.color;
        ctx.fillText(seg.text, x, CH / 2 + 4);
        x += ctx.measureText(seg.text).width;
      }
      tex.needsUpdate = true;
    }

    // recompute one shared font size that fits the widest of the 3 lines, then draw all 3
    function relayout() {
      const n = nouns[nounIndex];
      const verb = n.verbs[verbIndex % n.verbs.length].toUpperCase();
      const lines = [
        [{ text: 'BYO', color: '#000' }, { text: n.word, color: nounColor }],
        [{ text: 'HOW CAN ', color: '#000' }, { text: n.plural, color: nounColor }],
        [{ text: verb + ' ', color: verbColor }, { text: 'SCIENCE', color: '#000' }]
      ];
      const BASE = 300, maxW = CW * 0.94;
      let size = BASE;
      for (const segs of lines) {
        const w = widthOf(segs, BASE);
        if (w > maxW) size = Math.min(size, BASE * maxW / w);
      }
      lines.forEach((segs, i) => drawLine(layers[i], segs, size));
    }

    function cycleNoun() {
      nounIndex = (nounIndex + 1) % nouns.length;
      nounColor = randColor(); verbIndex = 0; verbColor = contrast(nounColor);
      relayout();
    }
    function cycleVerb() {
      verbIndex = (verbIndex + 1) % nouns[nounIndex].verbs.length;
      verbColor = contrast(nounColor);
      relayout();
    }

    // ---------- three.js scene ----------
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.set(0, 0, 7);
    camera.lookAt(0, 0, 0);

    const group = new THREE.Group();
    scene.add(group);

    // transparent glass cube + edges + slice dividers
    const boxGeo = new THREE.BoxGeometry(CUBE_W, CUBE_H, CUBE_D);
    group.add(new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({
      color: 0x6fa8d8, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false
    })));
    group.add(new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo),
      new THREE.LineBasicMaterial({ color: 0xbfc6cc, transparent: true, opacity: 0.6 })));
    function divider(y) {
      const hw = CUBE_W / 2, hd = CUBE_D / 2;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        -hw, y, -hd,  hw, y, -hd,  hw, y, hd,  -hw, y, hd,  -hw, y, -hd
      ]), 3));
      return new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xd5dade, transparent: true, opacity: 0.5 }));
    }
    group.add(divider(CUBE_H / 6));
    group.add(divider(-CUBE_H / 6));

    // each slice = a Group of 4 faces wrapped around the roll (X) axis.
    // a face becomes upright & camera-facing when the slice's rotation.x reaches its `front` angle.
    const HALF = Math.PI / 2;
    const faceDefs = [
      { pos: [0, 0,  R], rotX: 0 },        // front  → upright at θ = 0
      { pos: [0,  R, 0], rotX: -HALF },    // top    → upright at θ = +90°
      { pos: [0, 0, -R], rotX: Math.PI },  // back   → upright at θ = 180°
      { pos: [0, -R, 0], rotX:  HALF }     // bottom → upright at θ = +270°
    ];
    const planeGeo = new THREE.PlaneGeometry(PLANE_W, PLANE_H);
    const slices = [];
    const spinSpeed = [0.013, -0.017, 0.02];
    for (let i = 0; i < 3; i++) {
      const sliceGroup = new THREE.Group();
      sliceGroup.position.y = positions[i];
      for (const f of faceDefs) {
        const mat = new THREE.MeshBasicMaterial({ map: layers[i].tex, transparent: true, side: THREE.FrontSide, depthWrite: false });
        const mesh = new THREE.Mesh(planeGeo, mat);
        mesh.position.set(f.pos[0], f.pos[1], f.pos[2]);
        mesh.rotation.x = f.rotX;
        sliceGroup.add(mesh);
      }
      group.add(sliceGroup);
      slices.push(sliceGroup);
    }

    relayout();

    // ---------- interaction ----------
    let activeLine = 0;
    let lastX = [0, 0, 0], lastY = 0;
    const threshold = 45;
    const lineFromY = y => { const t = y / window.innerHeight; return t < 1 / 3 ? 0 : (t < 2 / 3 ? 1 : 2); };

    function handleMove(cx, cy) {
      activeLine = lineFromY(cy);
      const dx = cx - lastX[activeLine], dy = cy - lastY;
      if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy)) {
        if (activeLine === 2) cycleVerb(); else cycleNoun();
        lastX[activeLine] = cx;
      }
      lastY = cy;
    }
    window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', e => { e.preventDefault(); const t = e.touches[0]; handleMove(t.clientX, t.clientY); }, { passive: false });

    // ---------- render loop ----------
    const TWO_PI = Math.PI * 2;
    function animate() {
      requestAnimationFrame(animate);
      for (let i = 0; i < 3; i++) {
        const s = slices[i];
        if (i === activeLine) {
          const target = Math.round(s.rotation.x / TWO_PI) * TWO_PI;  // nearest flat (front face upright)
          s.rotation.x += (target - s.rotation.x) * 0.12;
        } else {
          s.rotation.x += spinSpeed[i];   // roll → text wraps around the other faces
        }
      }
      renderer.render(scene, camera);
    }

    // ---------- resize ----------
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.position.z = w / h < 1 ? 9.5 : 7;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    animate();
  })();
  </script>
</body>
</html>
